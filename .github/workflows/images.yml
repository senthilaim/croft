name: images

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["backend/**", "frontend/**", "automation/**", "packages/**", "docker-compose.yml", ".github/workflows/images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, dockerfile: backend/Dockerfile }
          - { name: frontend, dockerfile: frontend/Dockerfile }
          - { name: automation, dockerfile: automation/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/croft-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: |
          printf 'JWT_ACCESS_SECRET=%s\nJWT_REFRESH_SECRET=%s\nAUTOMATION_INTERNAL_TOKEN=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
          docker compose build
          docker compose up -d --wait
      - name: Frontend responds
        run: curl -fsS http://localhost:3000/signup >/dev/null
      - if: failure()
        run: docker compose logs
