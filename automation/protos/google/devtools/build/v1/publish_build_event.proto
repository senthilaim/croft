syntax = "proto3";

package google.devtools.build.v1;

import "google/devtools/build/v1/build_events.proto";
import "google/protobuf/empty.proto";

// Deliberately minimal, hand-trimmed subset of googleapis'
// google/devtools/build/v1/publish_build_event.proto -- the PublishBuildEvent service that
// Bazel's --bes_backend connects to, with only the fields this app reads. REST/HTTP gateway
// annotations (google/api/*) are dropped entirely since this is a pure gRPC server.

service PublishBuildEvent {
  rpc PublishLifecycleEvent(PublishLifecycleEventRequest) returns (google.protobuf.Empty);

  rpc PublishBuildToolEventStream(stream PublishBuildToolEventStreamRequest)
      returns (stream PublishBuildToolEventStreamResponse);
}

// Bazel sends lifecycle events (BuildEnqueued, InvocationAttemptStarted/Finished, BuildFinished)
// via this RPC when --bes_lifecycle_events is on (the default). This app only needs the RPC to
// exist and ack -- it doesn't inspect lifecycle event contents, so the message is empty.
message PublishLifecycleEventRequest {}

message OrderedBuildEvent {
  StreamId stream_id = 1;
  int64 sequence_number = 2;
  BuildEvent event = 3;
}

message PublishBuildToolEventStreamRequest {
  OrderedBuildEvent ordered_build_event = 4;
}

message PublishBuildToolEventStreamResponse {
  StreamId stream_id = 1;
  int64 sequence_number = 2;
}
